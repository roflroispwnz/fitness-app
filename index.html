<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse — фитнес-приложение</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#0f1b2d;--mute:#5d6b7e;--line:#dde3ea;--brand:#2447f5;--on:#fff;--warm:#ffb020;--ok:#16895a;--bad:#d63a45;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b121c;--card:#131d2b;--ink:#eaf0f7;--mute:#93a2b6;--line:#223044;--brand:#7b93ff;--on:#0b121c;--ok:#4cc790;--bad:#ff7a82;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b121c;--card:#131d2b;--ink:#eaf0f7;--mute:#93a2b6;--line:#223044;--brand:#7b93ff;--on:#0b121c;--ok:#4cc790;--bad:#ff7a82;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:26px;line-height:1.15;font-weight:800;margin:6px 0 14px;letter-spacing:-.01em}
h2{font-size:17px;font-weight:800;margin:0 0 4px}
p{margin:0}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on)}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--brand);border:1px solid currentColor;border-radius:6px;padding:1px 7px;margin-bottom:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn{background:var(--brand);color:var(--on);border:0;border-radius:12px;padding:11px 16px;font-weight:800}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.like{background:none;border:0;color:var(--mute);font-weight:600;padding:6px 0}
.like[aria-pressed="true"]{color:var(--brand)}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#tabs div{max-width:480px;margin:0 auto;display:flex}
#tabs button{flex:1;background:none;border:0;color:var(--mute);padding:9px 0 8px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
#tabs button[aria-current="page"]{color:var(--brand)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .card{margin:0}
.big{font-size:22px;font-weight:800}
.ex{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.ex .n{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-weight:800;flex:none}
.ex.done .n{background:var(--ok);color:var(--on)}
#sheet{position:fixed;inset:0;background:rgba(5,10,20,.55);display:none;align-items:flex-end;z-index:10}
#sheet.open{display:flex}
#sheet .pane{background:var(--bg);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.demo{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0}
.demo svg{display:block;width:100%;height:auto}
.bar{animation:lift 2.4s ease-in-out infinite;transform-box:fill-box}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-46px)}}
.timer{text-align:center;padding:12px}
.timer .t{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.timer.rest .t{color:var(--warm)}
.sets{display:flex;gap:8px;margin:8px 0 12px}
.sets span{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:7px 0;font-weight:800;color:var(--mute)}
.sets span.on{background:var(--ok);border-color:var(--ok);color:var(--on)}
.meal{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.msg{max-width:82%;padding:9px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--brand);border-color:var(--brand);color:var(--on)}
.send{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.srow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--card)}
.srow>span:first-child{width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-weight:800;flex:none}
.srow.on>span:first-child{background:var(--ok);color:var(--on)}
.srow.cur{border-color:var(--brand)}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
.av.s{width:30px;height:30px}
.mrow{display:flex;gap:8px;align-items:flex-end}
.tag.fill{background:var(--brand);color:var(--on);border-color:var(--brand)}
.li{display:flex;justify-content:space-between;gap:12px;padding-top:4px}
.av.m{width:36px;height:36px}
.by{display:flex;align-items:center;gap:10px;min-width:0}
.ini{display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);color:var(--mute);font-weight:800;font-size:13px}
.acts{display:flex;gap:14px}
.like[aria-expanded="true"]{color:var(--brand)}
.thr{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.cm{display:flex;gap:8px}
.cm .av{width:28px;height:28px;font-size:11px}
.btn:disabled{opacity:.6;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}
.cal span{font-size:11px;color:var(--mute)}
.cd{display:grid;place-items:center;aspect-ratio:1;border-radius:10px;font-weight:600}
.cd.on{background:var(--ok);color:var(--on)}
.cd.pl{background:var(--brand);color:var(--on)}
.cd.ms{border:2px solid var(--bad);color:var(--bad)}
.cd.td{outline:2px solid var(--ink);outline-offset:1px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dot.pl{background:var(--brand)}.dot.on{background:var(--ok)}.dot.ms{border:2px solid var(--bad)}.tag.st-ms{color:var(--bad)}.tag.st-on{color:var(--ok)}
.seg{display:flex;gap:8px}
.seg .btn{flex:1;padding:11px 8px;font-size:14px;border:1px solid transparent}
.seg .btn.ghost{border-color:var(--line)}
.btn.ok{background:var(--ok);color:var(--on)}
.btn.bad{background:var(--bad);color:var(--on)}
.demo{overflow:hidden}
.demo video{display:block;width:100%;max-height:55vh;object-fit:contain;background:#0b121c}

.lg-in{max-width:480px;min-height:100%;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.logo{font-size:clamp(22px,7vw,34px);letter-spacing:.03em;line-height:1.1;margin-top:6vh}
.logo b{font-weight:800}.logo span{font-weight:400}
.lg-t{font-size:18px;font-weight:600;margin:0 0 14px}
.sb{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:54px;border:0;border-radius:14px;color:#fff;font:800 16px Manrope,system-ui,sans-serif;margin-bottom:12px}
.sb.apple{background:#000}.sb.fb{background:#3b5998}.sb.vk{background:#0a7cff}
.sb.guest{background:#fff;color:#0f1b2d;margin-top:14px}
.gl{font-weight:800;font-size:20px;min-width:24px}
.lk{background:none;border:0;color:#fff;text-decoration:underline;font:600 16px Manrope,system-ui,sans-serif;padding:8px}
#lh{min-height:36px;font-size:13px;color:#ffd58a;margin:8px 0 0}
.lg-bot p{margin:0 0 4px;font-size:16px;font-weight:600}
.lg-bot .lg-legal{font-size:12px;font-weight:400;opacity:.8;margin-top:12px}
@media (prefers-reduced-motion:reduce){.bar{animation:none}}
#set-form:not([hidden]){display:grid;gap:12px}
#set-form label{display:grid;gap:4px}
#set-form input,#set-form select{font:inherit;padding:8px;width:100%;box-sizing:border-box}
#sets .srow{flex-wrap:wrap}
#set-add{margin-bottom:10px}
#set-list{margin:12px 0}#set-list summary{cursor:pointer;padding:12px 0;font-weight:800}
#timer h3{text-align:center;margin:0 0 14px}.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center;font-size:.82rem;color:var(--mute)}
.rings b{--accent:var(--brand);--fill:100%;display:grid;place-items:center;aspect-ratio:1;width:min(100%,88px);margin:0 auto 6px;border-radius:50%;color:var(--ink);font-size:clamp(1rem,5vw,1.35rem);font-variant-numeric:tabular-nums;background:radial-gradient(closest-side,var(--card) 86%,transparent 89%),conic-gradient(var(--accent) var(--fill),var(--line) 0)}
#done-value{--accent:var(--ok)}
#workout-plan summary{cursor:pointer;padding:12px 0;font-weight:700}
#new-ex,#new-workout{display:grid;gap:10px;margin:12px 0}
#new-ex label,#new-workout label{display:grid;gap:4px}
#delete-workout,.seg{margin-top:12px}
button.cd{font:inherit;color:inherit;background:transparent;border:1px solid transparent;cursor:pointer}
button.cd.on{background:var(--ok);color:var(--on)}button.cd.pl{background:var(--brand);color:var(--on)}button.cd.ms{border-color:var(--bad);color:var(--bad)}
 .exercise-row{position:relative;margin-bottom:10px}
.exercise-row .ex{margin:0;touch-action:pan-y;-webkit-touch-callout:none;user-select:none}
.exercise-row .ex b{overflow-wrap:anywhere}
.exercise-remove{display:none;align-self:center;border:1px solid currentColor;border-radius:10px;padding:8px 10px;background:var(--card);color:var(--bad);font-weight:700;cursor:pointer}
.exercise-line{display:flex;align-items:stretch;gap:6px}
.exercise-line .ex{min-width:0;flex:1}
.exercise-row.revealed .exercise-remove,.exercise-row:has(:focus-visible) .exercise-remove{display:block}
@media(hover:hover){.exercise-row:hover .exercise-remove{display:block}}
.exercise-question{padding:10px 12px;background:var(--bg);border-radius:12px;margin-top:5px}
.exercise-question p{margin:0 0 8px}
.food-edit{border:0;background:transparent;color:inherit;text-align:left;padding:3px 0;cursor:pointer;font:inherit;overflow-wrap:anywhere}.food-edit span{color:var(--mute)}.food-form label{display:grid;margin-bottom:8px}.meal [data-food-add]{margin-top:8px}
#login.profile-step{background:var(--bg);color:var(--ink);overflow:auto}
.profile-step .lg-in{display:none}
.body-panel{max-width:450px;margin:auto;padding:24px 16px 32px}
.body-panel h1{text-align:center}
.metric-card{margin:12px 0;padding:18px 8px;text-align:center;border-radius:14px;color:white;background:linear-gradient(120deg,#203440,#355b68);box-shadow:0 3px 10px #10222c22}
.metric-card:nth-of-type(2){background:linear-gradient(120deg,#244d50,#30696c)}
.metric-card:nth-of-type(3){background:linear-gradient(120deg,#263747,#455969)}
.metric-values{display:flex;justify-content:center;gap:14px;margin-top:8px}
.metric-values label{display:grid;justify-items:center;gap:3px;color:#e1eff2;font-size:13px}
.metric-values input{width:4.1em;padding:4px 6px;color:white;background:#ffffff12;border:1px solid #ffffff55;border-radius:8px;text-align:center;font-size:26px;font-weight:700}
.body-form>.btn{width:100%}
.wheel-frame{position:relative;width:86px;background:linear-gradient(transparent 33.33%,#ffffff20 33.33% 66.66%,transparent 66.66%);border-radius:9px}
.metric-wheel{height:108px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none;touch-action:pan-y;user-select:none;mask-image:linear-gradient(transparent,#000 34% 66%,transparent)}
.metric-wheel::-webkit-scrollbar{display:none}
.metric-wheel:before,.metric-wheel:after{content:"";display:block;height:36px}
.wheel-number{height:36px;line-height:36px;scroll-snap-align:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.wheel-frame:focus-within{outline:2px solid white}.wheel-error:empty{display:none}

/* ===== NEW DESIGN: «Pulse» ===== */
:root{--bg:#f3f2fb;--card:#fff;--ink:#14122b;--mute:#6b6a86;--line:#e6e4f4;--brand:#5b4df0;--on:#fff;--warm:#ff9f1c;--ok:#12a574;--bad:#e5384f;
--grad:linear-gradient(135deg,#5b4df0 0%,#9b4dff 55%,#ff5fa2 100%);--glow:0 10px 28px -10px rgba(91,77,240,.55);--sh:0 1px 2px rgba(20,18,43,.04),0 10px 30px -14px rgba(60,40,160,.22);--r:22px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a16;--card:#15142a;--ink:#f1f0ff;--mute:#9b99bd;--line:#26244a;--brand:#8e82ff;--on:#fff;--ok:#16b27f;--bad:#ff6b80;--sh:0 10px 30px -14px rgba(0,0,0,.7);--glow:0 10px 30px -10px rgba(142,130,255,.55)}}
:root[data-theme="dark"]{--bg:#0b0a16;--card:#15142a;--ink:#f1f0ff;--mute:#9b99bd;--line:#26244a;--brand:#8e82ff;--on:#fff;--ok:#16b27f;--bad:#ff6b80;--sh:0 10px 30px -14px rgba(0,0,0,.7);--glow:0 10px 30px -10px rgba(142,130,255,.55)}
body{background:var(--bg);background-image:radial-gradient(520px 320px at 100% -40px,rgba(155,77,255,.16),transparent 70%),radial-gradient(420px 300px at -10% 0,rgba(255,95,162,.10),transparent 70%);background-repeat:no-repeat;-webkit-font-smoothing:antialiased}
#app{padding:18px 16px 110px}
h1{font-size:30px;font-weight:800;letter-spacing:-.025em;margin:8px 0 18px}
h1::after{content:"";display:block;width:38px;height:5px;border-radius:9px;background:var(--grad);margin-top:10px}
h2{font-size:18px;letter-spacing:-.01em}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px;transition:transform .2s}
.card:active{transform:scale(.99)}
.chips{gap:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border-radius:999px;padding:8px 16px;font-weight:700;box-shadow:var(--sh);transition:.2s}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow)}
.tag{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:999px;padding:4px 10px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
.tag.fill{background:var(--grad);color:#fff}
.tag.st-ms{background:color-mix(in srgb,var(--bad) 14%,transparent)}.tag.st-on{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.btn{background:var(--grad);color:#fff;border-radius:16px;padding:13px 18px;font-weight:800;box-shadow:var(--glow);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#12a574,#2cd29b);box-shadow:0 10px 24px -10px rgba(18,165,116,.6)}
.btn.bad{background:linear-gradient(135deg,#e5384f,#ff6b80);box-shadow:0 10px 24px -10px rgba(229,56,79,.6)}
.like{font-weight:700}.like[aria-pressed="true"]{color:#ff3d7f}
.big{font-size:26px;letter-spacing:-.02em}
.stat .card{background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--brand) 7%,var(--card)))}
/* tab bar — floating pill */
#tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:0;border:1px solid var(--line);border-radius:26px;background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 18px 40px -12px rgba(30,20,90,.35)}
#tabs div{padding:6px 4px}
#tabs button{border-radius:18px;padding:8px 0 6px;font-size:10.5px;font-weight:700;transition:.2s}
#tabs button[aria-current="page"]{color:#fff;background:var(--grad);box-shadow:var(--glow)}
#tabs button[aria-current="page"] svg{transform:translateY(-1px) scale(1.08)}
/* exercises */
.ex{border-radius:20px;padding:14px;box-shadow:var(--sh);transition:transform .15s,border-color .2s}
.ex:active{transform:scale(.985)}
.ex .n{width:40px;height:40px;border-radius:14px;background:color-mix(in srgb,var(--brand) 13%,transparent);color:var(--brand);font-size:15px}
.ex.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.ex.done .n{background:var(--ok);color:#fff}
.srow{border-radius:16px;padding:11px 12px}.srow>span:first-child{border-radius:10px;width:30px;height:30px}
.srow.on>span:first-child{background:var(--ok);color:#fff}
.srow.cur{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
/* timer */
.timer .t{font-size:64px;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.timer.rest .t{background:linear-gradient(135deg,#ff9f1c,#ff5f6d);-webkit-background-clip:text;background-clip:text}
.sets span{border-radius:12px;padding:9px 0}.sets span.on{background:var(--ok);border-color:var(--ok);color:#fff}
/* sheet */
#sheet{background:rgba(8,6,24,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#sheet .pane{border-radius:30px 30px 0 0;border-top:1px solid var(--line);box-shadow:0 -20px 50px -20px rgba(0,0,0,.5);animation:up .3s cubic-bezier(.2,.8,.2,1)}
#sheet .pane::before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:-4px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.demo{border-radius:22px;box-shadow:var(--sh)}
/* chat */
.msg{border-radius:20px 20px 20px 6px;padding:10px 14px;box-shadow:var(--sh)}
.msg.me{background:var(--grad);border-color:transparent;color:#fff;border-radius:20px 20px 6px 20px}
input,#set-form input,#set-form select{border-radius:16px;padding:13px 14px;border:1px solid var(--line)}
input:focus{border-color:var(--brand);outline:3px solid color-mix(in srgb,var(--brand) 25%,transparent);outline-offset:0}
/* calendar */
.cd{border-radius:14px}.cd.on{background:var(--ok);color:#fff}
.cd.pl,button.cd.pl{background:var(--grad);color:#fff}
.cd.td{outline:2px solid var(--brand);outline-offset:2px}
/* food, feed, avatars */
.meal{padding:12px 0}
.av{border:2px solid var(--card);box-shadow:0 0 0 2px var(--brand)}
.av.s,.av.m,.cm .av{box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 60%,transparent)}
.ini{background:color-mix(in srgb,var(--brand) 13%,transparent);color:var(--brand)}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"›";float:right;font-size:22px;line-height:1;color:var(--mute);transition:transform .2s}
details[open]>summary::after{transform:rotate(90deg)}
table{width:100%;border-collapse:collapse}th{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em;text-align:left}
th,td{padding:10px 6px;border-bottom:1px solid var(--line)}
/* guide tiles */
.guide-title{margin-bottom:18px}
.guide-tile{border-radius:24px!important;box-shadow:0 16px 34px -16px rgba(20,10,80,.55);transition:transform .2s}
.guide-tile:active{transform:scale(.98)}
/* body parameters */
.metric-card{border-radius:24px;background:linear-gradient(135deg,#3b2fc9,#7b3dff)!important;box-shadow:var(--glow)}
.metric-card:nth-of-type(2){background:linear-gradient(135deg,#7b3dff,#d044c8)!important}
.metric-card:nth-of-type(3){background:linear-gradient(135deg,#d044c8,#ff5f8a)!important}
.wheel-frame{background:linear-gradient(transparent 33.33%,#ffffff2e 33.33% 66.66%,transparent 66.66%);border-radius:12px}
/* login */
#login::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 360px at 85% 8%,rgba(155,77,255,.5),transparent 70%),radial-gradient(420px 320px at 0 100%,rgba(255,95,162,.35),transparent 70%),linear-gradient(180deg,rgba(11,10,30,.25),rgba(11,10,30,.7))}
#login.profile-step::before{display:none}
.lg-in{position:relative;z-index:1}
.logo{font-size:clamp(26px,9vw,40px);letter-spacing:.06em}
.logo b{background:linear-gradient(135deg,#fff,#d9ccff 60%,#ffb3d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{opacity:.85}
.lg-t{opacity:.9}
.sb{height:56px;border-radius:18px;box-shadow:0 10px 24px -12px rgba(0,0,0,.6);transition:transform .15s}
.sb:active{transform:scale(.97)}
.sb.apple{background:#0d0d14;border:1px solid #ffffff22}.sb.fb{background:#3b5bdb}.sb.vk{background:#0a7cff}
.sb.guest{background:var(--grad);color:#fff;box-shadow:var(--glow);margin-top:16px}

var WO={"Пн":0,"Ср":2,"Пт":4};

S.day=dk(new Date());

if(!workouts){

 Object.keys(S.hist).forEach(function(key){
  var template=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"][dateOf(key).getDay()];

 });

function vTrain(){
 var d=workouts[S.day], date=dateOf(S.day).toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 var header='<h1>Тренировки</h1>'+cal()+'<div class="card"><h2>'+date+'</h2>';
 if(!d)return header+'<p class="mute">На этот день тренировки пока нет.</p><div id="new-workout"><label>Название тренировки<input name="title" maxlength="100" placeholder="Например, тренировка ног"></label><button type="button" id="create-workout" class="btn">Создать тренировку</button></div></div>';
 var items=d.ex.map(function(e,i){
  var completed=S.done[S.day+i]||0;
  return '<div class="exercise-row"><div class="exercise-line"><button class="ex" data-ex="'+i+'"><span class="n">'+(completed>=e.sets&&e.sets?"✓":i+1)+'</span><span style="flex:1"><b>'+esc(e.n)+'</b><br><span class="mute">'+sumr(e)+'</span></span><span>'+completed+'/'+e.sets+'</span></button><button type="button" class="exercise-remove" aria-label="Удалить упражнение '+esc(e.n)+'">Удалить</button></div></div>';
 }).join("");
 var status=S.hist[S.day],future=S.day>dk(new Date());
 var controls=future?'': '<div class="seg"><button class="btn '+(status===1?'ok':'ghost')+'" data-status="done">Выполнена'+(status===1?' ✓':'')+'</button><button class="btn '+(status==="m"?'bad':'ghost')+'" data-status="miss">Пропущена'+(status==="m"?' ✓':'')+'</button></div>';
 return header+'<h3>'+esc(d.title)+'</h3><details id="workout-plan"'+((S.wopen[S.day] ?? !items)?' open':'')+'><summary>План тренировки · '+d.ex.length+' '+pl(d.ex.length,"упражнение","упражнения","упражнений")+'</summary>'+items+
 '<details'+(d.ex.length?'':' open')+'><summary>Добавить упражнение</summary><form id="new-ex"><label>Название упражнения<input name="exercise" required maxlength="100"></label><label>Количество подходов<input name="count" type="number" min="1" max="100" value="3" required></label><label>Вес, кг (0 — свой вес)<input name="kg" type="number" min="0" step="any" value="0" required></label><label>Повторений в подходе<input name="reps" type="number" min="1" value="10" required></label><button class="btn" type="button" id="add-exercise">Добавить в тренировку</button></form></details></details>'+controls+'<button class="btn ghost" id="delete-workout" type="button">Удалить тренировку</button><div id="delete-question" hidden><p>Удалить тренировку «'+esc(d.title)+'» за '+fmt(dateOf(S.day))+' вместе с упражнениями?</p><div class="seg"><button type="button" class="btn ghost" id="cancel-delete">Отмена</button><button type="button" class="btn bad" id="confirm-delete">Удалить</button></div></div></div>';

 function selectDate(key){S.day=key;render()}
 document.querySelectorAll("[data-date]").forEach(function(b){b.onclick=function(){selectDate(b.dataset.date)}});

 var plan=$("#workout-plan"),planDay=S.day;
 if(plan)plan.ontoggle=function(){if(plan.isConnected)S.wopen[planDay]=plan.open};
 var exerciseForm=$("#new-ex");
 function addExercise(){

  if(!exerciseForm.reportValidity())return;

  d.ex.push({n:name,m:"Упражнение",work:40,rest:60,sets:sets.length,p:sets});

 }
 $("#add-exercise").onclick=addExercise;
 exerciseForm.oninput=function(){exerciseForm.elements.exercise.setCustomValidity("")};
 exerciseForm.onsubmit=function(event){event.preventDefault();addExercise()};
 exerciseForm.onkeydown=function(event){
  if(event.key==="Enter"&&!event.isComposing&&event.target.tagName==="INPUT"){event.preventDefault();addExercise()}
 };
 var activeRow=null;
 function dismissRow(){
  if(!activeRow)return;
  activeRow.classList.remove("revealed");
  var question=activeRow.querySelector(".exercise-question");
  if(question)question.remove();
  activeRow=null;
 }
 function revealRow(row){
  if(activeRow!==row)dismissRow();
  activeRow=row;
  row.classList.add("revealed");
 }
 document.querySelectorAll("[data-ex]").forEach(function(button){
  var row=button.closest(".exercise-row"), remove=row.querySelector(".exercise-remove");
  var index=Number(button.dataset.ex), timer, startX, startY, held=false;
  function cancelHold(){clearTimeout(timer)}
  button.onpointerdown=function(event){
   cancelHold();
   held=false;
   if(event.pointerType==="mouse" || !event.isPrimary)return;
   startX=event.clientX;startY=event.clientY;
   timer=setTimeout(function(){held=true;revealRow(row)},500);
  };
  button.onpointermove=function(event){
   if(Math.hypot(event.clientX-startX,event.clientY-startY)>10)cancelHold();
  };
  button.onpointercancel=button.onpointerup=button.onpointerleave=cancelHold;
  button.oncontextmenu=function(event){
   if(event.pointerType==="touch" || held)event.preventDefault();
  };
  button.onclick=function(event){
   if(held && event.detail){held=false;return}
   dismissRow();openEx(index);
  };
  remove.onclick=function(){
   revealRow(row);
   if(row.querySelector(".exercise-question"))return;
   var question=document.createElement("div");
   question.className="exercise-question";
   question.innerHTML='<p>Удалить упражнение «'+esc(d.ex[index].n)+'» из плана?</p><button type="button" class="btn bad">Да, удалить</button> <button type="button" class="btn ghost">Отмена</button>';
   row.appendChild(question);
   var actions=question.querySelectorAll("button");
   actions[1].focus();
   actions[1].onclick=function(){dismissRow();button.focus()};
   actions[0].onclick=function(){
    d.ex.splice(index,1);
    for(var pos=index;pos<d.ex.length;pos++){
     S.done[S.day+pos]=S.done[S.day+(pos+1)]||0;
    }
    delete S.done[S.day+d.ex.length];
    S.wopen[S.day]=true;
    persistWorkouts();render();
    var next=document.querySelector('[data-ex="'+Math.min(index,d.ex.length-1)+'"]');
    (next || $("#new-ex").elements.exercise).focus();
   };
  };
 });
 plan.addEventListener("pointerdown",function(event){
  if(activeRow && !activeRow.contains(event.target))dismissRow();
 });
 plan.addEventListener("keydown",function(event){
  if(event.key==="Escape" && activeRow){
   var trigger=activeRow.querySelector("[data-ex]");
   dismissRow();trigger.focus();
  }
 });
 document.querySelectorAll("[data-status]").forEach(function(b){b.onclick=function(){
  var value=b.dataset.status==="done"?1:"m";if(S.hist[S.day]===value)delete S.hist[S.day];else S.hist[S.day]=value;save("hist2",S.hist);render();
 }});
 var deleteButton=$("#delete-workout"), question=$("#delete-question");
 deleteButton.onclick=function(){question.hidden=false;$("#cancel-delete").focus()};
 $("#cancel-delete").onclick=function(){question.hidden=true;deleteButton.focus()};
 $("#confirm-delete").onclick=function(){
  d.ex.forEach(function(e,i){delete S.done[S.day+i]});delete S.wopen[S.day];delete workouts[S.day];delete S.hist[S.day];save("hist2",S.hist);persistWorkouts();render();
 };
}

function pl(n,a,b,c){var m=n%10,h=n%100;return m===1&&h!==11?a:(m>=2&&m<=4&&(h<12||h>14))?b:c}
function kgl(x){return x.kg===0?"свой вес":String(x.kg).replace(".",",")+" кг"}
function sumr(e){
 if(!e.sets)return "Подходов пока нет";
 var last=e.p[e.sets-1];
 if(e.p.every(function(x){return !x.w && x.kg===last.kg && x.r===last.r}))return e.sets+" × "+last.r+" · "+kgl(last);
 return e.sets+" "+pl(e.sets,"подход","подхода","подходов");
}
/* Видео-инструкция: если у упражнения есть поле video и файл найден, показываем его, иначе схему-заглушку */
function vid(e){
 if(!e.video)return demo();
 return '<div class="demo"><video src="'+e.video+'" autoplay muted loop playsinline controls preload="metadata" aria-label="Видео: '+e.n+'"></video></div>';
}
/* Таймер: подход → отдых. Отдых после подхода k: базовый + 15 с × (k−1) */
var T={id:null,phase:"idle",left:0,ex:null};
function stopT(){clearInterval(T.id);T.id=null;T.phase="idle"}
function fm(n){return Math.floor(n/60)+":"+("0"+n%60).slice(-2)}
function buzz(p){if(navigator.vibrate)try{navigator.vibrate(p)}catch(x){}}
function restAfter(e,completed){return e.rest+15*(completed-1)}
function paintT(){
 var box=$("#timer");if(!box)return;
 var e=workouts[S.day].ex[T.ex],c=S.done[S.day+T.ex]||0;
 var rest=T.phase==="rest", finished=e.sets>0 && c===e.sets;
 var next=e.p[c], duration=rest?restAfter(e,c):e.work;
 var seconds=T.phase==="idle"?(next?duration:0):T.left;
 $("#phase-title").textContent=finished?"Упражнение выполнено":next?((rest?"Далее · подход ":"Подход ")+(c+1)+" из "+e.sets+" · "+kgl(next)):"Подходов пока нет";
 $("#rep-value").textContent=next?next.r:"—";
 $("#time-value").textContent=fm(seconds);
 $("#time-label").textContent=rest?"Отдых":"Время подхода";
 $("#time-value").style.setProperty("--accent",rest?"var(--ok)":"var(--brand)");
 $("#time-value").style.setProperty("--fill",(duration?seconds/duration*100:0)+"%");
 $("#done-value").textContent=c+"/"+e.sets;
 $("#done-value").style.setProperty("--fill",(e.sets?c/e.sets*100:0)+"%");
 $("#tb").textContent=T.phase==="idle"?(e.sets && c>=e.sets?"Начать заново":"Старт"):(T.id===null?"Продолжить":"Пауза");
 $("#tb").disabled=!e.sets;
 if(!e.sets)$("#tb").textContent="Добавьте первый подход";
 $("#set-add").disabled=T.phase!=="idle";
 $("#sets").innerHTML=e.p.map(function(x,i){
  var cls=i<c?" on":(i===c&&T.phase==="work"?" cur":"");
  return '<div class="srow'+cls+'"><span>'+(i<c?"✓":i+1)+'</span><span style="flex:1"><b>'+kgl(x)+' × '+x.r+'</b> <span class="mute">'+(x.w?"разминка":"рабочий")+'</span></span><span class="mute">'+(i<e.sets-1?"отдых "+fm(restAfter(e,i+1)):"")+'</span><button class="chip" data-edit="'+i+'" aria-label="Изменить подход '+(i+1)+'" '+(T.phase==="idle"?"":"disabled")+'>Изменить</button></div>'}).join("");
}
function tick(){
 var e=workouts[S.day].ex[T.ex];
 T.left--;
 if(T.left<=0){
  if(T.phase==="work"){var c=(S.done[S.day+T.ex]||0)+1;S.done[S.day+T.ex]=c;buzz(200);
   if(c>=e.sets){stopT()}else{T.phase="rest";T.left=restAfter(e,c)}}
  else{T.phase="work";T.left=e.work;buzz([100,80,100])}
 }
 paintT();
}
function openEx(i){
 var e=workouts[S.day].ex[i];stopT();T.ex=i;
 $("#pane").innerHTML='<div class="row"><div><h2>'+esc(e.n)+'</h2><span class="tag">'+e.m+'</span></div><button class="btn ghost" id="close">Закрыть</button></div>'+
 vid(e)+
 '<details id="set-list"><summary>План подходов · <span id="set-count">'+e.sets+' '+pl(e.sets,"подход","подхода","подходов")+'</span></summary><p class="mute">Время подхода '+e.work+' с · отдых между подходами '+fm(e.rest)+', дальше +15 с после каждого подхода</p>'+
 '<div id="sets" style="margin:10px 0"></div><button type="button" class="btn ghost" id="set-add">Добавить подход</button><form class="card" id="set-form" hidden></form></details><section class="card" id="timer"><h3 id="phase-title"></h3><div class="rings"><div><b id="rep-value"></b>Повторения</div><div><b id="time-value"></b><span id="time-label"></span></div><div><b id="done-value"></b>Выполнено</div></div></section>'+
 '<button class="btn" id="tb" style="width:100%"></button>'+'<div class="card" style="margin-top:12px"><h2>Заметка тренеру</h2><p class="mute" style="margin-bottom:8px">Если вес или повторения отличались от плана, напишите.</p><div class="send"><input id="nt" placeholder="Например: 72,5 кг × 5, последний подход тяжело" aria-label="Заметка"><button class="btn" id="nts">Отправить</button></div></div>';
 $("#sheet").classList.add("open");
 $("#close").onclick=closeEx;
 var form=$("#set-form");
 var list=$("#set-list"), listKey="set-list:"+S.day+":"+e.n;
 list.open=load(listKey,false);
 list.ontoggle=function(){
  save(listKey,list.open);
  if(!list.open && !form.hidden){form.hidden=true;paintT()}
 };
 function editSet(index){
  if(T.phase!=="idle")return;
  var adding=index===e.p.length;
  var value=e.p[index] || e.p[index-1] || {kg:0,r:12,w:false};

 var L=S.wlog,n=L.length,ws=L.map(function(x){return x.w}),cur=S.weight;
 var mn=Math.min.apply(null,ws.concat(S.goalW))-1,mx=Math.max.apply(null,ws.concat(S.goalW))+1;
 var X=function(i){return 24+(n>1?i*(272/(n-1)):0)},Y=function(v){return 12+(mx-v)/(mx-mn)*78};
 var pts=L.map(function(x,i){return X(i)+","+Y(x.w)}).join(" ");
 var dots=L.map(function(x,i){return '<circle cx="'+X(i)+'" cy="'+Y(x.w)+'" r="3.5" fill="currentColor"/>'}).join("");

 '<text x="24" y="108" font-size="10" fill="var(--mute)">'+dd(L[0].d)+'</text><text x="296" y="108" font-size="10" text-anchor="end" fill="var(--mute)">'+dd(L[n-1].d)+'</text></svg>'+
 '<p class="mute">Пунктир — цель '+S.goalW+' кг · '+(df===0?"цель достигнута":"до цели "+Math.abs(df)+" кг")+'</p>'+
 '<div class="send" style="margin-top:8px"><label class="mute" style="flex:1">Вес, кг<input id="w" type="number" step="0.001" min="30" max="300" value="'+cur+'" style="display:block;width:100%;margin-top:4px"></label>'+

 '<button class="btn" id="ws" style="width:100%;margin-top:10px">Сохранить</button></div>';

  show(true);L.classList.add("profile-step");L.setAttribute("aria-label","Параметры тела");
  L.insertAdjacentHTML("beforeend",'<section class="body-panel"><h1>Параметры тела</h1><p>Укажите вес, рост и возраст. Позже их можно изменить в кабинете.</p>'+bodyForm(true)+'</section>');
  L.scrollTop=0;bindBody(L.querySelector(".body-form"),enter);
 }
 show(!authed());if(authed() && !bodyProfile)start();
 document.querySelectorAll("[data-stub]").forEach(function(b){b.onclick=function(){$("#lh").textContent="Вход "+b.dataset.stub+" пока не подключён: это визуальный макет. Нажмите «Вход без регистрации»."}});
 $("#guest").onclick=start;
 window.logout=function(){setA(false);$("#lh").textContent="";show(true);L.scrollTop=0};
})();
render();
</script>
</body>
</html>
